<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weather Model Comparison{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{{ url_for('dashboard') }}" class="logo">WX Compare</a>
            <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
            <a href="{{ url_for('drone_upload') }}" class="{{ 'active' if 'drone' in (request.endpoint or '') }}">Drone Missions</a>
            <a href="{{ url_for('station_view') }}" class="{{ 'active' if request.endpoint == 'station_view' }}">Tempest Station</a>
            <a href="{{ url_for('windy_view') }}" class="{{ 'active' if 'windy' in (request.endpoint or '') }}">Windy</a>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
